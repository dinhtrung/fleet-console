<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="admin-panel — an operable admin surface for users, roles, organizations, sessions and audit, running entirely on synthetic data." />
    <meta name="color-scheme" content="light" />
    <title>fleet-console</title>
    <script>
      // The board has one appearance, sage: it is the `:root` token block in src/index.css. A stored
      // choice from the retired five-appearance build is cleared before the first paint, so a stale
      // value cannot flash another palette and no dead preference survives on the machine.
      //
      // Display density is applied here too: it has to be in effect on the first paint, or the board
      // reflows once the app mounts.
      (function () {
        try {
          localStorage.removeItem("fleet-console.appearance");
          localStorage.removeItem("admin-panel.appearance");
          var density = localStorage.getItem("fleet-console.density");
          localStorage.removeItem("admin-panel.density");
          document.documentElement.setAttribute("data-density", density === "compact" ? "compact" : "comfortable");
        } catch (e) {
          document.documentElement.setAttribute("data-density", "comfortable");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
