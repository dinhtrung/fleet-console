version: "0.2"
name: fleet-console
permission_policy: builtin:yolo
non_interruptive: true
pods:
  - id: dev
    label: Issues
    members:
      - id: build-1
        agent_ref: local:./agents/development/implementer
        profile: default
        runtime: omp
        cwd: "."
        model: litellm/coder
        restore_policy: resume_if_possible
      - id: build-2
        agent_ref: local:./agents/development/implementer
        profile: default
        runtime: omp
        cwd: "."
        model: litellm/coder
        restore_policy: resume_if_possible
      - id: review
        agent_ref: local:./agents/development/qa
        profile: default
        runtime: omp
        cwd: "."
        model: litellm/coder
        restore_policy: resume_if_possible
    edges:
      - kind: delegates_to
        from: build-1
        to: review
      - kind: delegates_to
        from: build-2
        to: review
edges: []
