name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    # Bounded, because GitHub's default is 360 minutes: one wedged job holds the
    # queue and every merge in the fleet waits behind it (#93). 30m is ~5x the
    # slowest *successful* run measured today (319s) and still caps a stall at a
    # half hour instead of six.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: hashFiles('go.mod') != ''
        with:
          go-version: '1.25.x'
          cache: true
      - name: build, vet, test (CGO off)
        if: hashFiles('go.mod') != ''
        run: |
          set -euo pipefail
          go build ./...
          go vet ./...
          CGO_ENABLED=0 go build ./...
          go test ./...

  web:
    name: web
    runs-on: ubuntu-latest
    # The slowest successful run measured today was 539s (9m), not the ~40s a
    # warm cache gives: npm ci on a cold cache dominates and varies. 30m is ~3.3x
    # that tail, which bounds a wedged job without cutting off a slow-but-honest
    # one.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  openspec:
    name: openspec
    runs-on: ubuntu-latest
    # ~12s typical, 197s at the slowest measured success (the global npm install
    # is the variable part). 15m is ~4.5x that tail.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - run: npm install -g --no-audit --no-fund @fission-ai/openspec@1.14.3
      - run: openspec validate --all --strict
